[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20.19.1"
  NPM_VERSION = "10.2.4"
  GATSBY_GA_MEASUREMENT_ID = "G-XLRSRL1Y7K"
  # Gatsby-specific optimizations for Netlify
  GATSBY_CPU_COUNT = "2"
  GATSBY_EXPERIMENTAL_DEV_SSR = "false"
  GATSBY_EXPERIMENTAL_FAST_DEV = "true"
  # Ensure consistent plugin loading
  GATSBY_EXPERIMENTAL_QUERY_ON_DEMAND = "false"
  GATSBY_EXPERIMENTAL_PAGE_BUILD_ON_DATA_CHANGES = "false"
  # Disable compression at server level
  NETLIFY_USE_YARN = "false"
  NODE_ENV = "production"
  # Force fresh build
  FORCE_FRESH_BUILD = "true"

# Fix compression issues - disable all compression
[[headers]]
  for = "*.js"
  [headers.values]
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.html"
  [headers.values]
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=0, must-revalidate"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.json"
  [headers.values]
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=0, must-revalidate"
    Vary = "Accept-Encoding"

# Disable compression for all static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

# Disable compression for webpack chunks
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

# Force no compression for all files
[[headers]]
  for = "/*"
  [headers.values]
    Content-Encoding = "identity"
    Vary = "Accept-Encoding"

# 301 redirects for www/non-www subdomain handling
[[redirects]]
  from = "https://www.tomnovacek.com/*"
  to = "https://tomnovacek.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.tomnovacek.com/*"
  to = "https://tomnovacek.com/:splat"
  status = 301
  force = true

# Handle static assets with optimal caching
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Image optimization headers
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/avif"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Font optimization
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Page data caching
[[headers]]
  for = "/page-data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate" 