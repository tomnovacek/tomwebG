[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20.19.1"
  NPM_VERSION = "10.2.4"
  GATSBY_GA_MEASUREMENT_ID = "G-XLRSRL1Y7K"
  # Gatsby-specific optimizations for Netlify
  GATSBY_CPU_COUNT = "2"
  GATSBY_EXPERIMENTAL_DEV_SSR = "false"
  GATSBY_EXPERIMENTAL_FAST_DEV = "true"
  # Ensure consistent plugin loading
  GATSBY_EXPERIMENTAL_QUERY_ON_DEMAND = "false"
  GATSBY_EXPERIMENTAL_PAGE_BUILD_ON_DATA_CHANGES = "false"
  NETLIFY_USE_YARN = "false"
  NODE_ENV = "production"

# Handle 404 pages with correct status code
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

# Security headers for HTML pages only
[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Static assets caching
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JavaScript and CSS caching
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image caching
[[headers]]
  for = "/*.(jpg|jpeg|png|gif|webp|avif)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font caching
[[headers]]
  for = "/*.(woff|woff2|ttf|eot)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Page data - no caching for dynamic content
[[headers]]
  for = "/page-data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap and robots.txt - no caching
[[headers]]
  for = "/(sitemap*.xml|robots.txt)"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate" 